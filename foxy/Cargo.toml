[package]
name = "foxyXplorer"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"

[build-dependencies]
winresource = "0.1"

[dependencies]
coord = { version = "0.1.0", path = "../coord" }
declination = { version = "0.1.0", path = "../declination" }
geoio = { version = "0.1.0", path = "../geoio" }
grid = { version = "0.1.0", path = "../grid" }
iced = { version = "0.14", features = ["canvas", "image", "wgpu", "tiny-skia", "tokio"] }
ozf = { version = "0.1.0", path = "../ozf" }
ozmap = { version = "0.1.0", path = "../ozmap" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
dirs = "5"
rfd = { version = "0.14", default-features = false, features = ["xdg-portal", "tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
native-theme = { version = "0.6", features = ["native"] }
native-theme-iced = "0.6" 
lucide-iced = "0.4"
tokio = { version = "1", features = ["time"] }
resvg = "0.48" 
tiny-skia = "0.11"

[package.metadata.packager]
product-name = "FoxyXplorer"
identifier = "org.grantbor.foxyxplorer"
icons = ["assets/icon.png"]
out-dir = "dist"
formats = ["appimage"]
before-packaging-command = "cargo build --release"

[package.metadata.packager.linux]


[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
