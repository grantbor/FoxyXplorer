[package]
name = "foxyXplorer"
version = "0.4.5"
edition = "2024"
authors = ["Grant Borodin"]
license = "GPL-3.0-or-later"

[build-dependencies]
winresource = "0.1"
[dependencies]
coord = { version = "0.1.0", path = "../coord" }
declination = { version = "0.1.0", path = "../declination" }
geoio = { version = "0.1.0", path = "../geoio" }
grid = { version = "0.1.0", path = "../grid" }
iced = { version = "0.14", features = ["canvas", "image", "wgpu", "tiny-skia", "tokio"] }
ozf = { version = "0.1.0", path = "../ozf" }
ozmap = { version = "0.1.0", path = "../ozmap" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
dirs = "5"
rfd = { version = "0.14", default-features = false, features = ["xdg-portal", "tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lucide-iced = "0.4"
tokio = { version = "1", features = ["time", "fs", "net", "sync", "macros", "rt", "io-util"] }
resvg = "0.48"
tiny-skia = "0.11"
open = "5"
axum = { version = "0.8", features = ["multipart"] }
qrcode = { version = "0.14", default-features = false }
if-addrs = "0.13"
tzf-rs = { version = "2.1.3", default-features = false, features = ["bundled"] }
chrono = "0.4.45"
chrono-tz = "0.10.4"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[package.metadata.packager]
product-name = "FoxyXplorer"
identifier = "org.grantbor.foxyxplorer"
icons = ["assets/icon.png"]
out-dir = "dist"
before-packaging-command = "bash ./build-universal.sh"

[package.metadata.packager.linux]


[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"

[patch.crates-io]
lucide-iced = { path = "vendor/lucide-iced" }

[package.metadata.wix]
eula = false

